name: Custom Playwright Shoot

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'fait'
        type: choice
        options:
          - fait
          - abn
      test_path:
        description: 'Custom Playwright test path or pattern (for example: src/tests/auth/login.spec.ts or all)'
        required: true
        default: 'all'
        type: string
      test_grep:
        description: 'Optional Playwright grep filter (for example: Login or Checkout)'
        required: false
        default: ''
        type: string

jobs:
  playwright-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    environment: ${{ inputs.environment }}

    env:
      TEST_ENV: ${{ inputs.environment }}
      BASE_URL: ${{ inputs.environment == 'abn' && secrets.BASE_URL_ABN || secrets.BASE_URL_FAIT }}
      BASE_URL_FAIT: ${{ secrets.BASE_URL_FAIT }}
      BASE_URL_ABN: ${{ secrets.BASE_URL_ABN }}
      USER_NAME_FAIT: ${{ secrets.USER_NAME_FAIT }}
      USER_NAME_ABN: ${{ secrets.USER_NAME_ABN }}
      PASSWORD_FAIT: ${{ secrets.PASSWORD_FAIT }}
      PASSWORD_ABN: ${{ secrets.PASSWORD_ABN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        shell: bash
        run: |
          TEST_PATH="${{ inputs.test_path }}"
          GREP_FILTER="${{ inputs.test_grep }}"

          if [ -z "$GREP_FILTER" ]; then
            if [ "$TEST_PATH" = "all" ]; then
              npx playwright test
            else
              npx playwright test "$TEST_PATH"
            fi
          else
            if [ "$TEST_PATH" = "all" ]; then
              npx playwright test --grep "$GREP_FILTER"
            else
              npx playwright test "$TEST_PATH" --grep "$GREP_FILTER"
            fi
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
