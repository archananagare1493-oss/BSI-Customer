name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 # clones repository codes
    - uses: actions/setup-node@v4 # sets up node environment
      with:
        node-version: lts/* #uses latest lts version of node
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        TEST_ENV: ${{ secrets.TEST_ENV }}
        BASE_URL_FAIT: ${{ secrets.BASE_URL_FAIT }}
        USER_NAME_FAIT: ${{ secrets.USER_NAME_FAIT }}
        PASSWORD_FAIT: ${{ secrets.PASSWORD_FAIT }} 
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
